<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="X85" />
  <title>X85</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #palco{position:fixed;left:0;top:0;right:0;bottom:0;margin:0;padding:0}
    #tela{display:block;position:absolute;cursor:none;image-rendering:auto;background:#000}
    #texto{position:fixed;left:0;top:0;opacity:0;width:1px;height:1px;padding:0;border:0;font-size:16px;
      pointer-events:none;caret-color:transparent;color:transparent;background:transparent}
    #splash{position:fixed;inset:0;background:#000;z-index:20;cursor:pointer;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#c8c8c8}
    #splash[hidden],#pausa[hidden]{display:none}
    #splash-logo{position:absolute;height:auto}
    #splash-texto{position:absolute;text-align:center;letter-spacing:.04em}
    #splash-texto.pisca{animation:pisca 1.2s steps(2,start) infinite}
    @keyframes pisca{to{visibility:hidden}}
    #pausa{position:fixed;z-index:15;background:rgba(0,0,0,.6);color:#e8e8e8;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:.6em;cursor:pointer;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:clamp(14px,3vmin,28px)}
    #pausa b{font-size:1.8em;letter-spacing:.2em}
    #fps{position:fixed;z-index:30;pointer-events:none;font:11px/1 ui-monospace,Menlo,Consolas,monospace;
      color:#fff;opacity:.55;background:rgba(0,0,0,.35);padding:2px 4px;border-radius:3px}
  </style>
</head>
<body>
  <div id="palco"><canvas id="tela" width="800" height="600"></canvas></div>
  <div id="touch-root"></div>
  <div id="pausa" hidden><b>PAUSA</b><span>Clique / toque ou tecle para continuar</span></div>
  <div id="splash"><img id="splash-logo" src="./assets/dados/menu/x85.jpg" alt="X85" draggable="false" /><div id="splash-texto">Carregando…</div></div>
  <div id="fps">-- fps</div>
  <input id="texto" type="text" maxlength="14" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Nome" />
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
